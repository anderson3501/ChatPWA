<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chat de Superheroes</title>

    <link href='https://fonts.googleapis.com/css?family=Quicksand:300,400' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Lato:400,300' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animate.css">

    <link rel="shortcut icon" type="image/ico" href="img/favicon.ico" />
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#3498db">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ChatPWA">

    <link rel="apple-touch-icon" href="img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="img/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/icons/icon-192x192.png">

    <link rel="apple-touch-startup-image"
        media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
        href="img/icons-ios/apple-launch-1125x2436.png">

    <style>
        /* ESTA ES LA SOLUCIÓN PARA LOS BOTONES Y EL NOTCH */
        .first {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #3498db; /* Asegura que el color de tu barra cubra el notch */
            color: white;
            
            /* Empuja el contenido hacia abajo según el tamaño del notch del dispositivo */
            padding-top: env(safe-area-inset-top); 
            
            /* Si tu cabecera medía 50px, le sumamos el área segura */
            height: calc(60px + env(safe-area-inset-top)); 
            box-sizing: border-box;
        }

        /* Ajuste para que los botones dentro de .first no queden pegados arriba */
        .first span, .first i {
            display: flex;
            align-items: center;
        }

        /* Evita que los botones flotantes de abajo choquen con la barra de gestos de iOS */
        .fab, .fab-marker, .fab-photo {
            bottom: calc(20px + env(safe-area-inset-bottom)) !important;
        }
    </style>
</head>

<body>
    <header class="first">
        <span id="salir-btn" class="fa fa-sign-out-alt out oculto animated fadeIn"></span>
        <span id="titulo">
            <i class="fa fa-user"></i>
            Seleccione Personaje
        </span>
        <span id="nuevo-btn" class="fa fa-pen-square new oculto animated fadeIn fast"></span>
    </header>

    <div id="modal" class="oculto">
        <img id="modal-avatar" src="img/avatars/spiderman.jpg">

        <header class="first">
            <span id="titulo-modal">Nuevo mensaje</span>
            <span id="cancel-btn" class="fa fa-times"></span>
        </header>

        <div class="nuevo-mensaje">
            <textarea id="txtMensaje" placeholder="Nuevo mensaje..." rows="5"></textarea>
        </div>

        <div id="post-btn" class="fab">
            <i class="fa fa-paper-plane"></i>
        </div>
        <div class="fab-marker">
            <i class="fa fa-map-marker-alt"></i>
        </div>
        <div class="fab-photo">
            <i class="fa fa-image"></i>
        </div>
    </div>

    <div id="seleccion" class="seleccion animated fadeIn fast" align="center">
        <div><img data-user="spiderman" src="img/avatars/spiderman.jpg" alt="spiderman" class="seleccion-avatar"></div>
        <div><img data-user="ironman" src="img/avatars/ironman.jpg" alt="ironman" class="seleccion-avatar"></div>
        <div><img data-user="wolverine" src="img/avatars/wolverine.jpg" alt="wolverine" class="seleccion-avatar"></div>
        <div><img data-user="thor" src="img/avatars/thor.jpg" alt="thor" class="seleccion-avatar"></div>
        <div><img data-user="hulk" src="img/avatars/hulk.jpg" alt="hulk" class="seleccion-avatar"></div>
    </div>

    <ul id="timeline" class="timeline oculto">
        <li class="animated fadeIn fast">
            <div class="avatar"><img src="img/avatars/spiderman.jpg"></div>
            <div class="bubble-container">
                <div class="bubble">
                    <h3>@spiderman</h3>
                    <br />
                    La tía May hizo unos panqueques en forma de ironman!
                </div>
                <div class="arrow"></div>
            </div>
        </li>
    </ul>

    <script src="js/libs/jquery.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
